const RULES={skip:[[/отдельно/i,'«отдельно»'],[/при подаче/i,'«при подаче»'],[/бизе/i,'бизе'],[/(метал|стал)\S*\s+ват/i,'металлическая вата'],[/мотт?и/i,'моти'],[/цвет/i,'цветок, сухоцвет'],[/клубник\S*\s+свеж|свеж\S*\s+клубник/i,'свежая клубника'],[/изомальт/i,'изомальт'],[/пенообраз/i,'пенообразователь'],[/манго\S*\s+сублим|сублим\S*\s+манго/i,'манго сублимированный'],[/апельсин.*цедр|цедр.*апельсин/i,'цедра апельсина'],[/кофе\S*\s+зерн|зерн\S*\s+кофе/i,'кофе в зёрнах'],[/кубай.*газ|газ.*кубай/i,'кубай газ'],[/лист\S*\s+лайм/i,'лист лайма'],[/кумкват/i,'кумкват']],
text:['Четыре категории из листов «ПФ б/а», «ПФ алкогольные», «Коктейли Утка» и «Сезонное лето 2026».','Выход порции из таблицы не используется: порция равна сумме ингредиентов (мл и г считаются поровну, штуки и капли не входят).','Число порций округляется вниз до целого, ингредиенты считаются на это число.','Для коктейлей не учитываются ингредиенты с пометками «отдельно» и «при подаче», а также бизе, металлическая вата, моти, цветок, свежая клубника, изомальт, сухоцвет, пенообразователь, манго сублимированный, цедра апельсина, кофе в зёрнах, кубай газ, лист лайма, кумкват.','Категории ПФ: все ингредиенты учитываются без исключений, рецептура масштабируется от суммы ингредиентов без округления до порций, внизу выводится метод приготовления. Состав ПФ внутри коктейлей не раскладывается.','Объём под названием позиции в списке считается по сумме ингредиентов, а не берётся из таблицы.','Если в ТТК не указана единица или она явно ошибочна, рядом с ингредиентом стоит пометка ⚠.','Чтобы изменить правила, напишите в чате «изменение правил рассчета для мини приложения» и укажите, что поменять.']};
const ORDER=['ПФ б/а','ПФ алкогольные','Коктейли Утка'].filter(c=>D.some(r=>r.cat===c));
const $=q=>document.querySelector(q),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=x=>String(+x.toFixed(2)).replace('.',','),fmt=(v,u)=>v==null?'—':u==='мл'&&v>=1000?num(v/1000)+' л':u==='г'&&v>=1000?num(v/1000)+' кг':num(v)+' '+(u||'');
const K='ttk-hist-v1';let mem=[];try{mem=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
mem=mem.filter(x=>x.t>=Date.now()-7*864e5);const save=()=>{try{localStorage.setItem(K,JSON.stringify(mem))}catch(e){}};save();
let S={tab:'calc',view:'cats',cat:null,sub:'',q:'',rec:null,L:0,from:'',to:''};
function calc(r,L){const V=L*1000,rows=[],exc=[];
 for(const i of r.ing){const h=r.kind==='pf'?0:RULES.skip.find(k=>k[0].test(i.n+' '+(i.note||'')));h?exc.push({...i,why:h[1]}):rows.push(i)}
 const P=r.pv||rows.reduce((a,i)=>a+(i.u==='мл'||i.u==='г'?i.v:0),0);
 if(!P)return{err:'В ТТК нет объёмных ингредиентов для расчёта.'};
 if(r.kind==='pf')return{pf:1,k:V/P,rows,exc,V,y:P};
 const n=Math.floor(V/P);if(!n)return{err:'Объём меньше одной порции ('+fmt(P,'мл')+').'};
 return{n,P,rows,exc,V}}
const vol=r=>{if(r.cat!=='Коктейли Утка')return'';if(r.pv)return fmt(r.pv,'мл');const P=r.ing.filter(i=>(r.kind==='pf'||!RULES.skip.some(k=>k[0].test(i.n+' '+(i.note||''))))&&(i.u==='мл'||i.u==='г')).reduce((a,i)=>a+i.v,0);return P?fmt(P,'мл'):''};
function vCats(){return'<h2>Категории</h2><div class="grid">'+ORDER.map(c=>`<button class="cat" data-a="cat" data-v="${esc(c)}"><b>${esc(c)}</b><span>${D.filter(r=>r.cat===c).length} поз.</span></button>`).join('')+'</div>'}
function vItems(){const subs=[...new Set(D.filter(r=>r.cat===S.cat).map(r=>r.sub).filter(Boolean))];
 return`<button class="back" data-a="home">← Категории</button><h2>${esc(S.cat)}</h2><input id="q" placeholder="Поиск" value="${esc(S.q)}">`+(subs.length>1?'<div class="chips">'+subs.map(s=>`<button class="chip${S.sub===s?' on':''}" data-a="sub" data-v="${esc(s)}">${esc(s)}</button>`).join('')+'</div>':'')+'<div class="list" id="list"></div>'}
function drawList(){const q=S.q.toLowerCase(),f=D.filter(r=>r.cat===S.cat&&(!S.sub||r.sub===S.sub)&&r.name.toLowerCase().includes(q));
 $('#list').innerHTML=f.length?f.map(r=>`<button class="it" data-a="pick" data-v="${r.id}"><b>${esc(r.name)}</b><span>${esc([r.sub,vol(r)&&'объём '+vol(r)].filter(Boolean).join(' · '))}</span></button>`).join(''):'<div class="msg">Ничего не найдено</div>'}
function vRes(){const r=S.rec,c=calc(r,S.L),h=`<button class="back" data-a="items">← ${esc(r.cat)}</button><h2>${esc(r.name)}</h2>`;
 if(c.err)return h+`<div class="sum">${c.err}</div><button class="btn" data-a="vol">Изменить объём</button>`;
 const L=num(S.L)+' л',m=c.pf?`ПФ на <b>${L}</b>. Объём рецептуры (сумма ингредиентов) ${fmt(c.y,'мл')}, коэффициент <b>×${num(c.k)}</b>.`:`<b>${c.n} порц.</b> по ${fmt(c.P,'мл')} = ${fmt(c.n*c.P,'мл')} из ${L}.`;
 const k=c.pf?c.k:c.n;
 return h+`<div class="sum">${m}</div><div class="tw"><table><tr><th>Ингредиент</th><th>${c.pf?'В ТТК':'На порцию'}</th><th>Всего</th></tr>`+c.rows.map(i=>`<tr><td>${esc(i.n)}</td><td>${fmt(i.v,i.u)}</td><td class="t">${i.v==null?'—':fmt(i.v*k,i.u)}</td></tr>`).join('')+'</table></div>'+(r.m?'<h3>Метод приготовления</h3><div class="mt">'+esc(r.m)+'</div>':'')+'<button class="btn" data-a="vol">Изменить объём</button>'}
function vHist(){const d=v=>v?new Date(v+'T00:00'):null,f=d(S.from),t=d(S.to),te=t&&new Date(+t+864e5);
 const a=mem.filter(x=>D.some(r=>r.cat===x.c&&r.name===x.n)&&(!f||x.t>=+f)&&(!te||x.t<+te)).sort((x,y)=>y.t-x.t);
 const day=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toLocaleDateString('sv')};
 return`<h2>История за 7 дней</h2><div class="chips">${[['Сегодня',0],['3 дня',2],['7 дней',6]].map(c=>`<button class="chip${S.from===day(c[1])&&!S.to?' on':''}" data-a="range" data-v="${c[1]}">${c[0]}</button>`).join('')}<button class="chip${!S.from&&!S.to?' on':''}" data-a="range" data-v="">Все</button></div>
 <div class="row dt"><input type="date" id="df" value="${S.from}"><input type="date" id="dt" value="${S.to}"></div><div class="list">`+(a.length?a.map(x=>`<button class="hi" data-a="hist" data-v="${x.t}"><b>${esc(x.n)} · ${num(x.L)} л</b><span>${esc(x.c)} · ${new Date(x.t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></button>`).join(''):'<div class="msg">Запросов за выбранный период нет</div>')+'</div>'}
function vRules(){return'<h2>Правила расчёта</h2><ul>'+RULES.text.map(t=>`<li>${t}</li>`).join('')+'</ul>'}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
 $('#app').innerHTML=S.tab==='hist'?vHist():S.view==='items'?vItems():S.view==='res'?vRes():vCats();if(S.tab==='calc'&&S.view==='items')drawList()}
function ask(r){S.rec=r;$('#dn').textContent=r.name;$('#vol').value='';$('#qv').innerHTML=[0.5,1,1.5,2,3,5].map(v=>`<button class="chip" data-q="${v}">${num(v)} л</button>`).join('');$('#ov').classList.add('on');setTimeout(()=>$('#vol').focus(),50)}
function go(){const L=parseFloat($('#vol').value.replace(',','.'));if(!(L>0))return $('#vol').focus();
 S.L=L;S.tab='calc';S.view='res';mem.push({t:Date.now(),c:S.rec.cat,n:S.rec.name,L});save();$('#ov').classList.remove('on');render()}
document.addEventListener('click',e=>{const q=e.target.closest('[data-q]');if(q){$('#vol').value=q.dataset.q;return go()}
 if(e.target.id==='ov')return $('#ov').classList.remove('on');
 const t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;return render()}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='cat'){S={...S,cat:v,sub:'',q:'',view:'items'}}else if(a==='home'){S.view='cats'}else if(a==='items'){S.view='items'}
 else if(a==='sub'){S.sub=S.sub===v?'':v}else if(a==='pick')return ask(D[+v]);else if(a==='vol')return ask(S.rec);
 else if(a==='range'){S.from=v===''?'':(()=>{const x=new Date();x.setDate(x.getDate()-v);return x.toLocaleDateString('sv')})();S.to=''}
 else if(a==='hist'){const x=mem.find(i=>i.t==v),r=x&&D.find(r=>r.cat===x.c&&r.name===x.n);if(!r)return;S={...S,rec:r,L:x.L,cat:r.cat,tab:'calc',view:'res'}}
 render()});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;drawList()}else if(e.target.id==='df'||e.target.id==='dt'){S[e.target.id==='df'?'from':'to']=e.target.value;render()}});
$('#go').onclick=go;$('#vol').onkeydown=e=>{if(e.key==='Enter')go()};render();
</script></body></html>
